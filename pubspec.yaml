name: et_marketplace_app
description: Multi‑vendor e‑commerce platform – ET Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Networking
  dio: ^5.9.2
  http: ^1.6.0                     
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Images & UI
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_html: ^3.0.0-beta.2
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Utilities
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.5
  intl: 0.20.2
  google_fonts: ^6.3.3
  url_launcher: ^6.2.5

  # Premium Icons
  phosphor_flutter: ^2.1.0
  image_picker: ^1.2.2

  # Charts
  fl_chart: ^0.68.0

  # Firebase – push notifications
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.5
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  curved_navigation_bar: ^1.0.6

  # Video playback
  video_player: ^2.8.0
  geolocator: ^14.0.3

  # Maps & WebSocket
  google_maps_flutter: ^2.5.0
  web_socket_channel: ^2.4.0
  path_provider: ^2.1.6
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Share
  share_plus: ^13.2.0

  # Localisation
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  webview_flutter: ^4.14.0
  flutter_pdfview: ^1.4.4
  open_filex: ^4.7.0

  # Lottie
  lottie: ^3.1.3

  # ★ SMS Auto‑Fill (for password reset OTP)
  sms_autofill: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icon/icon.png
    - assets/l10n/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF4400"
  adaptive_icon_foreground: "assets/icon/icon.png"